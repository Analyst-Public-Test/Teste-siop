name: PAC 2026 - Qlik completo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Instala navegador
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exporta Novo PAC e gera JSON completo
        run: |
          cat > pac_qlik.py <<'PYEOF'
          import os,time,csv,io,json,re,unicodedata
          from playwright.sync_api import sync_playwright
          URL='https://www1.siop.planejamento.gov.br/QvAJAXZfc/opendoc.htm?document=IAS%2FExecucao_Orcamentaria.qvw&host=QVS%40pqlk04&anonymous=true&sheet=SH06'
          os.makedirs('debug',exist_ok=True); os.makedirs('dados',exist_ok=True)
          def wait(p,s=6):
              try:p.wait_for_load_state('networkidle',timeout=20000)
              except:pass
              time.sleep(s)
          def shot(p,n): p.screenshot(path='debug/'+n+'.png',full_page=True)
          def find_activate(p,text):
              p.keyboard.press('Control+f'); time.sleep(.5); p.keyboard.type(text,delay=60); time.sleep(1); p.keyboard.press('Escape'); p.keyboard.press('Enter'); wait(p,8)
          def norm(s): return re.sub(r'[^a-z0-9]+',' ',unicodedata.normalize('NFKD',s or '').encode('ascii','ignore').decode().lower()).strip()
          def num(s):
              s=(s or '').strip().replace(' ','');
              if s in ('','-','–'): return 0.0
              neg=s.startswith('('); s=s.strip('()').replace('.','').replace(',','.')
              try:v=float(s)
              except:return 0.0
              return -v if neg else v
          captured=[]
          with sync_playwright() as pw:
              b=pw.chromium.launch(args=['--no-sandbox']); c=b.new_context(locale='pt-BR',accept_downloads=True,viewport={'width':1536,'height':960})
              p=c.new_page(); p.on('download',lambda d: captured.append(d))
              p.goto(URL,timeout=120000); wait(p,10); shot(p,'01-abriu')
              # A URL já entra diretamente na folha SH06 (Novo PAC).
              shot(p,'02-novo-pac-direto')
              # Ativa a exibição de Restos a Pagar.
              find_activate(p,'Mostrar valores de Restos a Pagar'); shot(p,'03-rap')
              # Busca um cabeçalho da tabela, fecha busca e abre menu de contexto na região focada.
              p.keyboard.press('Control+f'); p.keyboard.type('Dotação Atual',delay=50); time.sleep(1); p.keyboard.press('Escape');
              p.keyboard.press('Shift+F10'); time.sleep(2); shot(p,'04-menu')
              find_activate(p,'Exportar');
              end=time.time()+120
              while time.time()<end and not captured: time.sleep(2)
              shot(p,'05-exportou')
              if not captured: raise RuntimeError('Exportação não foi capturada')
              path=captured[-1].path(); raw=open(path,'rb').read(); open('debug/export.csv','wb').write(raw); b.close()
          txt=None
          for enc in ('utf-8-sig','cp1252','latin-1'):
              try: txt=raw.decode(enc); break
              except: pass
          sep=';' if txt.count(';')>txt.count('\t') else '\t'; rows=list(csv.DictReader(io.StringIO(txt),delimiter=sep))
          if not rows: raise RuntimeError('CSV vazio')
          cols={norm(k):k for k in rows[0]}
          def col(r,*names):
              for n in names:
                  if norm(n) in cols:return r.get(cols[norm(n)],'')
              return ''
          acc={}
          for r in rows:
              ac=col(r,'Ação')[:4]; ano=col(r,'Ano'); uo=col(r,'Unidade Orçamentária')[:5]
              if not ac or not ano.isdigit() or not uo.startswith('41'): continue
              k=(ano,ac); a=acc.setdefault(k,{'acao':ac,'dotacao_atual':0,'empenhado':0,'liquidado':0,'pago':0,'credito_contido':0,'rp_inscritos':0,'rp_pagos':0})
              a['dotacao_atual']+=num(col(r,'Dotação Atual'))
              a['empenhado']+=num(col(r,'Empenhado'))
              a['liquidado']+=num(col(r,'Liquidado'))
              a['pago']+=num(col(r,'Pago Exercício','Pago'))
              a['credito_contido']+=num(col(r,'Bloqueado 107'))+num(col(r,'Bloqueado 108'))
              a['rp_inscritos']+=num(col(r,'RAP Exercícios Anteriores'))+num(col(r,'RAP Inscrito Não Processado'))+num(col(r,'Rap Inscrito Processado'))
              a['rp_pagos']+=num(col(r,'RAP Pago Não Processado'))+num(col(r,'RAP Pago Processado'))
          data={'fonte':'Painel do Orçamento Federal - Novo PAC','gerado_em':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'anos':{}}
          for (ano,ac),v in acc.items(): data['anos'].setdefault(ano,[]).append(v)
          if '2026' not in data['anos']: raise RuntimeError('2026 não encontrado no CSV')
          json.dump(data,open('dados/pac-qlik.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('OK 2026:',[(x['acao'],x['dotacao_atual'],x['empenhado'],x['rp_inscritos'],x['rp_pagos']) for x in data['anos']['2026']])
          PYEOF
          python pac_qlik.py
      - name: Guarda diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qlik-completo-debug
          path: debug/
          if-no-files-found: ignore
      - name: Commit JSON
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add dados/pac-qlik.json
          git diff --staged --quiet || git commit -m "Atualiza PAC 2026 pelo Qlik"
          git push
